# 8G was the Flutter template default and this machine has 14G in total, so a
# single daemon could not be backed by real memory — the GC thrashed and the
# daemon was killed mid-build. Three of them, one per app, made it certain.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin stays off, and the reason is not ours to fix.
#
# From AGP 9 the Android Gradle plugin compiles Kotlin itself, and a plugin that also
# applies `kotlin-android` fails the build outright. Turning this to true was tried on
# 2026-09-20: it fails in app_links' own build.gradle.kts, which applies KGP with no
# version check. app_links is already at its latest (7.2.1) and we do not choose it —
# it arrives under supabase_flutter. So this cannot flip until that package migrates.
#
# What that costs: `flutter build` warns that sentry_flutter applies KGP, because
# sentry 9.30 reads exactly this property before deciding. The day app_links migrates,
# flipping this line clears the warning with no other change. package_info_plus 10.2.1
# and maplibre_gl 0.27.1 are already clear either way.
android.builtInKotlin=false
# Kotlin's incremental compiler cannot close its caches on this drive, and the build
# fails part-way through every plugin module with "Could not close incremental caches".
# Turning it off costs rebuild time and nothing else.
kotlin.incremental=false
