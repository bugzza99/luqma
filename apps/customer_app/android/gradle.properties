# 8G was the Flutter template default and this machine has 14G in total, so a
# single daemon could not be backed by real memory — the GC thrashed and the
# daemon was killed mid-build. Three of them, one per app, made it certain.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler cannot close its caches on this drive, and the build
# fails part-way through every plugin module with "Could not close incremental caches".
# Turning it off costs rebuild time and nothing else.
kotlin.incremental=false
