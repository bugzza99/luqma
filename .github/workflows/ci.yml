name: Release gate

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      run_cloud:
        description: Run destructive tests against the dedicated Supabase test project
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luqma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: Local checks and release APK smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Restore dependencies
        shell: pwsh
        run: |
          npm ci --prefix supabase
          flutter pub get
      # Every freezed model, every Riverpod provider and the Arabic strings are generated,
      # and `.g.dart`, `.freezed.dart` and `app_localizations*` are all gitignored — so a
      # fresh checkout has none of them. Without this step every type they define resolves
      # to `dynamic`, and the first thing that notices is an exhaustive `switch` over an
      # enum failing to compile in a file nobody touched.
      #
      # It runs here rather than inside a script because every step below compiles Dart:
      # the smoke checks, the suites, and the release APKs. This was the release gate's
      # own bug — it failed on every push, for the same reason, whatever the push
      # contained, which is the state in which a gate stops being read.
      - name: Generate code
        shell: pwsh
        run: |
          foreach ($package in @(
              'packages/luqma_core', 'apps/customer_app',
              'apps/merchant_app', 'apps/admin_app')) {
            Push-Location $package
            try {
              dart run build_runner build --delete-conflicting-outputs
              if ($LASTEXITCODE -ne 0) { throw "$package failed to generate" }
            } finally { Pop-Location }
          }
          Push-Location packages/luqma_core
          try {
            flutter gen-l10n
            if ($LASTEXITCODE -ne 0) { throw 'gen-l10n failed' }
          } finally { Pop-Location }
      - name: Fast public-seam smoke
        shell: pwsh
        run: ./tool/run_smoke_tests.ps1
      - name: Analyze, unit, widget and PGlite suites
        shell: pwsh
        run: ./tool/run_tests.ps1 -SkipCloud
      - name: Build all release-mode APKs and scan secrets
        shell: pwsh
        run: ./tool/build-ci-apks.ps1

  cloud:
    name: Dedicated Supabase cloud suites
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_cloud)
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      LUQMA_TEST_PROJECT_REF: ${{ secrets.LUQMA_TEST_PROJECT_REF }}
      LUQMA_TEST_DB_PASSWORD: ${{ secrets.LUQMA_TEST_DB_PASSWORD }}
      LUQMA_TEST_SERVICE_KEY: ${{ secrets.LUQMA_TEST_SERVICE_KEY }}
      LUQMA_TEST_ANON_KEY: ${{ secrets.LUQMA_TEST_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Validate and write dedicated test credentials
        shell: pwsh
        run: |
          $required = @(
            $env:LUQMA_TEST_PROJECT_REF,
            $env:LUQMA_TEST_DB_PASSWORD,
            $env:LUQMA_TEST_SERVICE_KEY,
            $env:LUQMA_TEST_ANON_KEY
          )
          if ($required.Where({ -not $_ }).Count -gt 0) { throw 'One or more LUQMA_TEST_* secrets are missing' }
          New-Item -ItemType Directory -Force supabase/.temp | Out-Null
          Set-Content supabase/.temp/test-project-ref $env:LUQMA_TEST_PROJECT_REF -NoNewline
          Set-Content supabase/.temp/test-db-password.txt $env:LUQMA_TEST_DB_PASSWORD -NoNewline
          Set-Content supabase/.temp/test-service-key.txt $env:LUQMA_TEST_SERVICE_KEY -NoNewline
          Set-Content supabase/.temp/test-anon-key.txt $env:LUQMA_TEST_ANON_KEY -NoNewline
      - name: Restore dependencies
        shell: pwsh
        run: |
          npm ci --prefix supabase
          flutter pub get
      # The same step the local job has, and the reason it was missing here is the reason
      # this job had never run: `.g.dart`, `.freezed.dart` and `app_localizations*` are
      # gitignored, so a fresh checkout has none of them and the first Dart step fails to
      # compile. That was found and fixed once already — in the job that runs on every
      # push. This job runs only on a schedule, and until the LUQMA_TEST_* secrets existed
      # it died on the credential check before reaching any Dart at all, so the identical
      # omission sat here unseen.
      - name: Generate code
        shell: pwsh
        run: |
          foreach ($package in @(
              'packages/luqma_core', 'apps/customer_app',
              'apps/merchant_app', 'apps/admin_app')) {
            Push-Location $package
            try {
              dart run build_runner build --delete-conflicting-outputs
              if ($LASTEXITCODE -ne 0) { throw "$package failed to generate" }
            } finally { Pop-Location }
          }
          Push-Location packages/luqma_core
          try {
            flutter gen-l10n
            if ($LASTEXITCODE -ne 0) { throw 'gen-l10n failed' }
          } finally { Pop-Location }

      - name: Cloud RPC smoke
        shell: pwsh
        run: ./tool/run_smoke_tests.ps1 -Cloud
      - name: Stack and live repository suites
        shell: pwsh
        run: ./tool/run_tests.ps1 -CloudOnly
