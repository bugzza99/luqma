targets:
  $default:
    builders:
      json_serializable:
        options:
          # Without this, a nested model is written out as the object itself rather than
          # as a map. That is fine for `jsonEncode`, which calls `toJson` on the way past,
          # and silently wrong for Firestore, which is handed the raw object and refuses
          # it — so saving a merchant with menu categories, or an order with line items,
          # fails at runtime while every read still works.
          explicit_to_json: true
          # Keeps a field absent rather than written as null, so a merge never overwrites
          # a value the form did not carry.
          include_if_null: false
